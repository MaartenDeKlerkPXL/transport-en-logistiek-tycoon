# Zet het spel live op GitHub Pages bij elke push: eerst de tests, dan bouwen met Vite.
# Eenmalig nodig: Settings → Pages → Source: "GitHub Actions".
name: Deploy naar GitHub Pages

on:
  push:
    branches: ["main", "claude/clever-einstein-r9tq5f"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pakketten installeren
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Bouwen met Vite
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
